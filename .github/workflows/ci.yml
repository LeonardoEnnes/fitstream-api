name: FitStream API CI

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master", "dev" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: fitstream_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('__functionalTest/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Build spring application and run tests
        run: ./mvnw clean verify
        env:
          DB_URL: jdbc:postgresql://localhost:5432/fitstream_db
          DB_USERNAME: postgres
          DB_PASSWORD: password

      - name: Install jest functional test dependencies
        run: |
          cd __functionalTest
          pnpm install --frozen-lockfile

      - name: Start Spring Boot application
        run: |
          nohup java -jar target/*.jar &

          echo "Aguardando a API inicializar..."
          while ! nc -z localhost 8080; do
            sleep 2
          done
        env:
          DB_URL: jdbc:postgresql://localhost:5432/fitstream_db
          DB_USERNAME: postgres
          DB_PASSWORD: password

      - name: Run functional Tests
        run: |
          cd __functionalTest
          pnpm test

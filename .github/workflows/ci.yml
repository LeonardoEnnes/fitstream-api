name: FitStream API CI

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master", "dev" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: fitstream_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      #Configura o Node.js para rodar os testes funcionais
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
          run_install: false

      - name: Build and Run Spring Unit/Integration Tests
        run: ./mvnw clean verify -Dspring.datasource.url=jdbc:postgresql://localhost:5432/fitstream_db -Dspring.datasource.username=postgres -Dspring.datasource.password=password

      - name: Install Functional Test Dependencies
        run: |
          cd __functionalTest
          pnpm install --frozen-lockfile

      - name: Start Spring Boot Application in Background
        run: |
          nohup java -jar target/*.jar --spring.datasource.url=jdbc:postgresql://localhost:5432/fitstream_db --spring.datasource.username=postgres --spring.datasource.password=password &

          # Aguarda a API subir completamente na porta 8080
          echo "Aguardando a API inicializar..."
          while ! nc -z localhost 8080; do
            sleep 2
          done

      - name: Run Functional Tests
        run: |
          cd __functionalTest
          pnpm test
